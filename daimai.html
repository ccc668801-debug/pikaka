<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Pika 買買助手</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--maca-yellow:#FFF2CC;--pika-brown:#5C4033;--bg-color:#FEF9EF;--btn-active:#F3A05F;--tax-red:#FFADAD;--check-green:#A8D5BA;--deduct-bg:#E8F5E9;--ship-purple:#E1D5E7;}
*{font-family:'Zen Maru Gothic',sans-serif !important;box-sizing:border-box;-webkit-font-smoothing:antialiased;font-weight:700;}
body{background:var(--bg-color);color:var(--pika-brown);margin:0;padding-bottom:90px;display:flex;flex-direction:column;align-items:center;min-height:100vh;}
.top-bar{background:#fff;padding:10px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--maca-yellow);position:sticky;top:0;z-index:1000;width:100%;max-width:420px;}
.view-section{width:100%;max-width:420px;display:none;padding:0 10px;}
.active{display:block;}
.pika-header{font-size:1.5rem;color:var(--btn-active);text-align:center;margin:15px 0;}
.panel{background:#fff;padding:15px;border-radius:25px;border:3px solid var(--maca-yellow);margin-bottom:15px;box-shadow:0 4px 10px rgba(0,0,0,0.05);}
input,textarea,select,button{width:100%;padding:12px;margin:8px 0;border:2px solid #eee;border-radius:15px;font-size:1rem;outline:none;background:#fff;color:var(--pika-brown);}
input:focus,textarea:focus,select:focus{border-color:var(--btn-active);}
.btn-main{background:var(--btn-active);border-radius:20px;border:none;color:white;cursor:pointer;font-size:1.1rem;margin-top:10px;box-shadow:0 4px 0 #d38446;}
.btn-main:active{transform:translateY(2px);box-shadow:0 2px 0 #d38446;}
.btn-outline{width:100%;padding:11px;background:#FFF9E8;border:1.5px solid #F5DFA3;border-radius:16px;margin-top:8px;cursor:pointer;font-size:0.9rem;color:var(--pika-brown);font-weight:700;}
.btn-outline:active{transform:scale(0.98);}
.toast-msg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(74,55,40,0.88);color:#fff;padding:12px 24px;border-radius:50px;font-size:0.95rem;z-index:9999;display:none;box-shadow:0 4px 15px rgba(0,0,0,0.2);}
.friend-group{margin-bottom:12px;border-radius:20px;border:2.5px solid var(--maca-yellow);background:#fff;overflow:hidden;}
.friend-header{background:var(--maca-yellow);padding:12px 15px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;}
.friend-content{display:none;padding:10px;background:#fff;}
.friend-group.open .friend-content{display:block;}
.deduct-box{background:#fffbf0;padding:10px;border-radius:18px;border:2.5px dashed var(--btn-active);margin-bottom:12px;display:none;flex-direction:column;gap:8px;transition:0.3s;}
.deduct-box.show{display:flex;}
.has-deduct{background:var(--deduct-bg);border-style:solid;border-color:var(--check-green);}
.item-row{display:flex;align-items:center;padding:12px 10px;border-bottom:1px solid #eee;gap:8px;transition:0.2s;background:#fff;}
.row-packed{background:#f4fbf7 !important;opacity:0.75;}
.row-unpacked{background:#fff5f5 !important;opacity:0.65;}
.row-shipped{background:var(--ship-purple) !important;opacity:0.85;}
.row-normal{background:#fff !important;opacity:1;}
.check-circle{width:24px;height:24px;border-radius:50%;border:2px solid #ddd;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:0.8rem;}
.is-packed{background:var(--check-green);border-color:var(--check-green);color:white;}
.cross-circle{width:24px;height:24px;border-radius:50%;border:2px solid #ddd;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:0.7rem;color:#aaa;}
.is-unpacked{background:var(--tax-red);border-color:var(--tax-red);color:white;}
.ship-circle{width:24px;height:24px;border-radius:50%;border:2px solid #ddd;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:0.7rem;background:#f3e5f5;color:#8e24aa;}
.is-shipped{background:#8e24aa;border-color:#8e24aa;color:white;}
.reset-circle{width:24px;height:24px;border-radius:50%;border:2px solid #ddd;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:0.65rem;background:#f9f9f9;color:#666;}
.packed-name{text-decoration:line-through;color:#aaa;}
.stat-row-packed{background:#E8F5E9 !important;opacity:0.9 !important;}
.list-img{width:55px;height:55px;border-radius:12px;object-fit:cover;border:1px solid #eee;flex-shrink:0;cursor:pointer;}
.btn-tax{width:auto !important;padding:3px 8px !important;margin:0 !important;border-radius:8px !important;border:1.5px solid var(--tax-red) !important;font-size:0.75rem !important;color:var(--tax-red) !important;cursor:pointer;}
.tax-active{background:var(--tax-red) !important;color:#fff !important;}
.btn-sm-action{width:auto !important;padding:3px 8px !important;margin:0 !important;border-radius:8px !important;font-size:0.75rem !important;cursor:pointer;border:1.5px solid #ddd !important;background:#f9f9f9 !important;color:#666 !important;}
.btn-copy{width:auto;background:#f5f5f5;border:none;padding:6px 12px;border-radius:12px;font-size:0.85rem;color:#666;cursor:pointer;}
.bottom-nav{position:fixed;bottom:0;width:100%;max-width:420px;background:#fff;display:flex;justify-content:space-around;padding:10px 10px calc(10px + env(safe-area-inset-bottom));border-top:3px solid var(--maca-yellow);z-index:1000;}
.nav-item{font-size:.8rem;cursor:pointer;text-align:center;color:#aaa;flex:1;}
.nav-item.active{color:var(--btn-active);}
.modal{position:fixed;inset:0;background:rgba(254,249,239,0.85);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:3000;}
.modal-content{background:#fff;width:88%;max-width:360px;padding:20px;border-radius:25px;border:4px solid var(--maca-yellow);max-height:90vh;overflow-y:auto;box-shadow:0 10px 25px rgba(92,64,51,0.15);}
</style>
</head>
<body>
<div id="toastMessage" class="toast-msg">登記成功</div>
<datalist id="buyerSuggestions"></datalist>

<div class="top-bar">
<div style="display:flex;align-items:center;gap:6px;">
<span style="font-size:0.8rem;color:#888;">📦 團別:</span>
<select id="activeCampSelect" onchange="switchCamp(this.value)" style="width:auto;padding:4px 8px;margin:0;font-size:0.85rem;border-radius:10px;border:1.5px solid var(--maca-yellow);"></select>
</div>
<div style="display:flex;gap:10px;align-items:center;">
<span onclick="openCampModal()" style="cursor:pointer;font-size:1.2rem" title="管理代購團">🏷️</span>
<div style="display:flex;align-items:center;gap:2px;">
<span onclick="openModal('settingModal')" style="cursor:pointer;font-size:1.5rem">⚙️</span>
<span style="font-size:0.65rem;color:#aaa;font-weight:normal;">v4.0</span>
</div>
</div>
</div>

<div id="addView" class="view-section active">
<h2 class="pika-header">代購商品</h2>
<div class="panel">
<input type="text" id="friendInput" list="buyerSuggestions" placeholder="買家名字">
<button type="button" onclick="fillLastBuyer()" class="btn-outline" style="margin-top:0;margin-bottom:8px;padding:6px;font-size:0.8rem;">帶入上一位買家繼續新增 ⚡</button>
<input type="text" id="itemName" placeholder="商品名稱">
<div style="display:flex;gap:8px;align-items:center;">
<select id="itemPriceType" style="flex:1;margin:8px 0;">
<option value="jpy">日幣匯率計價</option>
<option value="ntd">台幣定價</option>
</select>
<input type="number" id="itemPrice" placeholder="請輸入價格" style="flex:2;margin:8px 0;">
</div>
<div style="display:flex;gap:8px;align-items:center;">
<input type="number" id="itemQty" value="1" min="1" placeholder="數量" style="flex:1;margin:8px 0;">
<input type="text" id="itemNote" placeholder="備註 (尺寸/顏色等)" style="flex:2;margin:8px 0;">
</div>
<div style="margin:8px 0;">
<label style="font-size:0.85rem;color:#888;display:block;margin-bottom:4px;">商品圖片 (選填)</label>
<input type="file" id="itemImageFile" accept="image/*" style="padding:8px;font-size:0.85rem;" onchange="handleImageUpload(event)">
<input type="hidden" id="itemImageBase64">
<div id="imagePreviewContainer" style="margin-top:6px;display:none;">
<img id="imagePreview" style="width:60px;height:60px;object-fit:cover;border-radius:10px;border:1px solid #ddd;">
</div>
</div>
<button class="btn-main" onclick="addItem()">登記商品 ✨</button>
</div>
</div>

<div id="listView" class="view-section">
<h2 class="pika-header">買家代購單</h2>
<div style="display:flex;gap:8px;margin-bottom:12px;">
<input type="text" id="searchKeyword" placeholder="搜尋買家或商品..." oninput="renderLists()" style="margin:0;flex:1;">
<button class="btn-outline" onclick="expandAll(true)" style="width:auto;margin:0;padding:0 12px;font-size:0.8rem;">展開</button>
<button class="btn-outline" onclick="expandAll(false)" style="width:auto;margin:0;padding:0 12px;font-size:0.8rem;">收合</button>
</div>
<div id="buyerListContainer"></div>
</div>

<div id="statsView" class="view-section">
<h2 class="pika-header">採購清單統計</h2>
<div class="panel">
<div style="display:flex;justify-content:space-between;margin-bottom:10px;font-size:0.95rem;">
<span>總品項數: <strong id="statTotalItems">0</strong></span>
<span>已買齊: <strong id="statBoughtItems" style="color:var(--check-green)">0</strong></span>
</div>
<div style="display:flex;justify-content:space-between;margin-bottom:15px;font-size:0.95rem;">
<span>預估日幣總額: <strong id="statTotalJpy">0</strong> 円</span>
<span>預估台幣總額: <strong id="statTotalNtd">0</strong> NT$</span>
</div>
<div style="display:flex;gap:8px;">
<button class="btn-outline" onclick="resetProgress()" style="flex:1;background:#fff5f5;color:var(--tax-red);border-color:var(--tax-red);">重置採購進度 🔄</button>
<button class="btn-outline" onclick="exportData()" style="flex:1;">匯出備份 💾</button>
</div>
<button class="btn-outline" onclick="document.getElementById('importFile').click()" style="margin-top:8px;">匯入還原 📂</button>
<input type="file" id="importFile" style="display:none" onchange="importData(event)">
</div>
<div id="statListContainer"></div>
</div>

<div class="bottom-nav">
<div class="nav-item active" onclick="switchView('add',this)">➕<br>登記</div>
<div class="nav-item" onclick="switchView('list',this)">📋<br>代購單</div>
<div class="nav-item" onclick="switchView('stats',this)">📊<br>統計</div>
</div>

<!-- Modal: 設定 -->
<div id="settingModal" class="modal">
<div class="modal-content">
<h3 style="margin-top:0;color:var(--btn-active)">⚙️ 系統設定</h3>
<div style="margin:12px 0;">
<label style="font-size:0.85rem;color:#666;display:block;margin-bottom:4px;">本團代購匯率 (日幣折台幣):</label>
<input type="number" id="campRateInput" step="0.001" placeholder="例如 0.22" onchange="updateCampSetting('rate',this.value)">
</div>
<div style="margin:12px 0;">
<label style="font-size:0.85rem;color:#666;display:block;margin-bottom:4px;">本團成本匯率 (選填):</label>
<input type="number" id="campCostRateInput" step="0.001" placeholder="例如 0.21" onchange="updateCampSetting('costRate',this.value)">
</div>
<div style="margin:15px 0;">
<label style="display:flex;align-items:center;gap:10px;cursor:pointer;">
<input type="checkbox" id="settingShowItemPrice" onchange="toggleSettingShowItemPrice(this.checked)" style="width:auto;margin:0;">
<span>顯示商品明細原價／定價 (賣家核對用)</span>
</label>
</div>
<button class="btn-main" onclick="closeModal('settingModal')">確定</button>
</div>
</div>

<!-- Modal: 代購團管理 -->
<div id="campModal" class="modal">
<div class="modal-content">
<h3 style="margin-top:0;color:var(--btn-active)">🏷️ 管理代購團</h3>
<div id="campListContainer" style="max-height:150px;overflow-y:auto;margin-bottom:10px;"></div>
<input type="text" id="newCampName" placeholder="新代購團名稱 (例如 2026東京11月)">
<button class="btn-main" onclick="createNewCamp()">新增代購團 ✨</button>
<button class="btn-outline" onclick="closeModal('campModal')" style="margin-top:10px;">關閉</button>
</div>
</div>

<!-- Modal: 編輯商品 -->
<div id="editModal" class="modal">
<div class="modal-content">
<h3 style="margin-top:0;color:var(--btn-active)">✏️ 編輯商品</h3>
<input type="hidden" id="editItemId">
<input type="text" id="editFriendInput" placeholder="買家名字">
<input type="text" id="editItemName" placeholder="商品名稱">
<div style="display:flex;gap:8px;align-items:center;">
<select id="editItemPriceType" style="flex:1;margin:8px 0;">
<option value="jpy">日幣匯率計價</option>
<option value="ntd">台幣定價</option>
</select>
<input type="number" id="editItemPrice" placeholder="價格" style="flex:2;margin:8px 0;">
</div>
<div style="display:flex;gap:8px;align-items:center;">
<input type="number" id="editItemQty" min="1" placeholder="數量" style="flex:1;margin:8px 0;">
<input type="text" id="editItemNote" placeholder="備註" style="flex:2;margin:8px 0;">
</div>
<div style="display:flex;gap:8px;margin-top:10px;">
<button class="btn-main" onclick="saveEditItem()" style="flex:1;margin:0;">儲存</button>
<button class="btn-outline" onclick="closeModal('editModal')" style="flex:1;margin:0;background:#f5f5f5;">取消</button>
</div>
</div>
</div>

<!-- Modal: 買家小費與訂金/抵扣 -->
<div id="buyerModal" class="modal">
<div class="modal-content">
<h3 style="margin-top:0;color:var(--btn-active)" id="modalBuyerTitle">買家結算設定</h3>
<input type="hidden" id="modalBuyerName">
<div style="margin:10px 0;">
<label style="font-size:0.85rem;color:#666;">已付訂金 / 折抵金額 (NT$):</label>
<input type="number" id="modalBuyerDeposit" placeholder="例如 500">
</div>
<div style="margin:10px 0;">
<label style="font-size:0.85rem;color:#666;">運費 / 額外費用 (NT$):</label>
<input type="number" id="modalBuyerShipping" placeholder="例如 60">
</div>
<div style="margin:10px 0;">
<label style="font-size:0.85rem;color:#666;">備註說明:</label>
<input type="text" id="modalBuyerNote" placeholder="例如 7-11店到店">
</div>
<button class="btn-main" onclick="saveBuyerMeta()">儲存設定 ✨</button>
<button class="btn-outline" onclick="closeModal('buyerModal')" style="margin-top:8px;">取消</button>
</div>
</div>

<script>
let db = JSON.parse(localStorage.getItem('pika_buy_db_v4')) || {
  activeCamp: '預設代購團',
  camps: {
    '預設代購團': { rate: 0.22, costRate: 0.21, showItemPrice: true, items: [], buyerMeta: {} }
  }
};

let lastAddedBuyer = '';

function saveDb() {
  localStorage.setItem('pika_buy_db_v4', JSON.stringify(db));
}

function getCurrentCamp() {
  if (!db.camps[db.activeCamp]) {
    db.activeCamp = Object.keys(db.camps)[0] || '預設代購團';
    if (!db.camps[db.activeCamp]) {
      db.camps[db.activeCamp] = { rate: 0.22, costRate: 0.21, showItemPrice: true, items: [], buyerMeta: {} };
    }
  }
  return db.camps[db.activeCamp];
}

function showToast(msg) {
  const t = document.getElementById('toastMessage');
  t.innerText = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 1800);
}

function switchView(viewName, el) {
  document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  if(viewName === 'add') document.getElementById('addView').classList.add('active');
  if(viewName === 'list') { document.getElementById('listView').classList.add('active'); renderLists(); }
  if(viewName === 'stats') { document.getElementById('statsView').classList.add('active'); renderStats(); }
  el.classList.add('active');
}

function initApp() {
  renderCampSelect();
  updateCampSettingsUI();
  updateBuyerSuggestions();
}

function renderCampSelect() {
  const sel = document.getElementById('activeCampSelect');
  sel.innerHTML = '';
  Object.keys(db.camps).forEach(campName => {
    const opt = document.createElement('option');
    opt.value = campName;
    opt.innerText = campName;
    if(campName === db.activeCamp) opt.selected = true;
    sel.appendChild(opt);
  });
}

function switchCamp(campName) {
  db.activeCamp = campName;
  saveDb();
  updateCampSettingsUI();
  renderLists();
  updateBuyerSuggestions();
  showToast(`已切換至: ${campName}`);
}

function updateCampSettingsUI() {
  const camp = getCurrentCamp();
  if(camp.rate === undefined) camp.rate = 0.22;
  if(camp.costRate === undefined) camp.costRate = 0.21;
  if(camp.showItemPrice === undefined) camp.showItemPrice = true;
  document.getElementById('campRateInput').value = camp.rate;
  document.getElementById('campCostRateInput').value = camp.costRate;
  document.getElementById('settingShowItemPrice').checked = camp.showItemPrice;
}

function updateCampSetting(field, val) {
  const camp = getCurrentCamp();
  camp[field] = parseFloat(val) || 0;
  saveDb();
  renderLists();
}

function toggleSettingShowItemPrice(isChecked) {
  const camp = getCurrentCamp();
  camp.showItemPrice = isChecked;
  saveDb();
  renderLists();
}

function handleImageUpload(e) {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(event) {
    const base64 = event.target.result;
    document.getElementById('itemImageBase64').value = base64;
    const prev = document.getElementById('imagePreview');
    prev.src = base64;
    document.getElementById('imagePreviewContainer').style.display = 'block';
  };
  reader.readAsDataURL(file);
}

function fillLastBuyer() {
  if(lastAddedBuyer) {
    document.getElementById('friendInput').value = lastAddedBuyer;
    showToast(`已帶入: ${lastAddedBuyer}`);
  } else {
    showToast('尚無上一位買家記錄');
  }
}

function updateBuyerSuggestions() {
  const camp = getCurrentCamp();
  const list = document.getElementById('buyerSuggestions');
  list.innerHTML = '';
  const buyers = [...new Set(camp.items.map(i => i.friend))];
  buyers.forEach(b => {
    const opt = document.createElement('option');
    opt.value = b;
    list.appendChild(opt);
  });
}

function addItem() {
  const friend = document.getElementById('friendInput').value.trim();
  const name = document.getElementById('itemName').value.trim();
  const priceType = document.getElementById('itemPriceType').value;
  const price = parseFloat(document.getElementById('itemPrice').value);
  const qty = parseInt(document.getElementById('itemQty').value) || 1;
  const note = document.getElementById('itemNote').value.trim();
  const image = document.getElementById('itemImageBase64').value;

  if(!friend || !name || isNaN(price)) {
    alert('請完整填寫買家名字、商品名稱與價格！');
    return;
  }

  const camp = getCurrentCamp();
  const newItem = {
    id: 'item_' + Date.now() + Math.random().toString(36).substr(2, 5),
    friend,
    name,
    priceType, // 'jpy' or 'ntd'
    price,
    qty,
    boughtQty: 0,
    status: 'unpacked', // 'unpacked', 'packed', 'shipped'
    note,
    image
  };

  camp.items.push(newItem);
  lastAddedBuyer = friend;
  saveDb();

  // Reset form inputs except buyer
  document.getElementById('itemName').value = '';
  document.getElementById('itemPrice').value = '';
  document.getElementById('itemQty').value = '1';
  document.getElementById('itemNote').value = '';
  document.getElementById('itemImageBase64').value = '';
  document.getElementById('imagePreviewContainer').style.display = 'none';
  document.getElementById('itemImageFile').value = '';

  updateBuyerSuggestions();
  showToast(`成功登記: ${name}`);
}

function renderLists() {
  const camp = getCurrentCamp();
  const container = document.getElementById('buyerListContainer');
  const keyword = document.getElementById('searchKeyword').value.trim().toLowerCase();
  container.innerHTML = '';

  const groups = {};
  camp.items.forEach(item => {
    if(keyword && !item.friend.toLowerCase().includes(keyword) && !item.name.toLowerCase().includes(keyword)) return;
    if(!groups[item.friend]) groups[item.friend] = [];
    groups[item.friend].push(item);
  });

  const buyerNames = Object.keys(groups);
  if(buyerNames.length === 0) {
    container.innerHTML = '<div style="text-align:center;padding:30px;color:#aaa;">目前沒有登記商品</div>';
    return;
  }

  buyerNames.forEach(buyer => {
    const items = groups[buyer];
    if(!camp.buyerMeta) camp.buyerMeta = {};
    const meta = camp.buyerMeta[buyer] || { deposit: 0, shipping: 0, note: '' };

    // Calculate totals based on qty (ordered quantity)
    let totalNTD = 0;
    items.forEach(item => {
      const q = item.qty || 1;
      if(item.priceType === 'ntd') {
        totalNTD += (item.price || 0) * q;
      } else {
        totalNTD += Math.round((item.price || 0) * camp.rate * q);
      }
    });

    const finalAmount = totalNTD - (meta.deposit || 0) + (meta.shipping || 0);
    const hasDeduct = (meta.deposit > 0 || meta.shipping > 0 || meta.note);

    const groupDiv = document.createElement('div');
    groupDiv.className = 'friend-group open';
    groupDiv.id = 'group_' + buyer;

    let itemsHtml = '';
    items.forEach(item => {
      let rowClass = 'row-normal';
      let checkClass = 'check-circle';
      let crossClass = 'cross-circle';
      let shipClass = 'ship-circle';

      if(item.status === 'packed') {
        rowClass = 'row-packed';
        checkClass += ' is-packed';
      } else if(item.status === 'shipped') {
        rowClass = 'row-shipped';
        shipClass += ' is-shipped';
      } else {
        rowClass = 'row-unpacked';
        crossClass += ' is-unpacked';
      }

      let priceTag = '';
      if(camp.showItemPrice) {
        if(item.priceType === 'ntd') {
          priceTag = `<span style="font-size:0.8rem;color:#888;background:#f5f5f5;padding:2px 6px;border-radius:6px;">NT$ ${item.price}</span>`;
        } else {
          priceTag = `<span style="font-size:0.8rem;color:#888;background:#f5f5f5;padding:2px 6px;border-radius:6px;">${item.price} 円</span>`;
        }
      }

      let imgHtml = item.image ? `<img src="${item.image}" class="list-img" onclick="showBigImg('${item.image}')">` : '';

      itemsHtml += `
        <div class="item-row ${rowClass}">
          ${imgHtml}
          <div style="flex:1;">
            <div style="display:flex;align-items:center;gap:6px;">
              <span style="font-size:0.95rem;font-weight:700;">${item.name}</span>
              ${priceTag}
            </div>
            <div style="font-size:0.8rem;color:#666;margin-top:2px;">
              數量: ${item.qty} ${item.note ? ' | ' + item.note : ''}
            </div>
          </div>
          <div style="display:flex;gap:4px;align-items:center;">
            <div class="${checkClass}" onclick="toggleStatus('${item.id}','packed')" title="已買到">✓</div>
            <div class="${crossClass}" onclick="toggleStatus('${item.id}','unpacked')" title="未買到">✕</div>
            <div class="${shipClass}" onclick="toggleStatus('${item.id}','shipped')" title="已寄出">📦</div>
            <div class="reset-circle" onclick="openEditModal('${item.id}')" title="編輯">✏️</div>
            <div class="reset-circle" onclick="deleteItem('${item.id}')" title="刪除">🗑️</div>
          </div>
        </div>
      `;
    });

    groupDiv.innerHTML = `
      <div class="friend-header" onclick="toggleGroup(this)">
        <div style="display:flex;align-items:center;gap:8px;">
          <span>👤 ${buyer}</span>
          <span style="font-size:0.8rem;background:#fff;padding:2px 8px;border-radius:10px;color:var(--btn-active);">總計: NT$ ${finalAmount}</span>
        </div>
        <div style="display:flex;gap:6px;align-items:center;">
          <span onclick="event.stopPropagation();openBuyerModal('${buyer}')" style="font-size:1rem;cursor:pointer;" title="訂金/運費設定">💰</span>
          <span style="font-size:0.8rem;color:#888;">▼</span>
        </div>
      </div>
      <div class="friend-content">
        <div class="deduct-box ${hasDeduct ? 'show has-deduct' : ''}" id="deduct_box_${buyer}">
          <div style="font-size:0.8rem;color:#555;display:flex;justify-content:space-between;">
            <span>訂金折抵: NT$ ${meta.deposit || 0} | 運費: NT$ ${meta.shipping || 0}</span>
            ${meta.note ? '<span>備註: ' + meta.note + '</span>' : ''}
          </div>
        </div>
        ${itemsHtml}
        <div style="display:flex;justify-content:flex-end;margin-top:10px;">
          <button class="btn-copy" onclick="copyBuyerOrder('${buyer}')">📋 複製買家對帳單</button>
        </div>
      </div>
    `;
    container.appendChild(groupDiv);
  });
}

function toggleGroup(headerEl) {
  const group = headerEl.parentElement;
  group.classList.toggle('open');
}

function expandAll(isOpen) {
  document.querySelectorAll('.friend-group').forEach(g => {
    if(isOpen) g.classList.add('open');
    else g.classList.remove('open');
  });
}

function toggleStatus(id, targetStatus) {
  const camp = getCurrentCamp();
  const item = camp.items.find(i => i.id === id);
  if(!item) return;

  if(item.status === targetStatus) {
    item.status = 'unpacked';
    item.boughtQty = 0;
  } else {
    item.status = targetStatus;
    item.boughtQty = (targetStatus === 'unpacked') ? 0 : item.qty;
  }
  saveDb();
  renderLists();
}

function deleteItem(id) {
  if(!confirm('確定要刪除這個商品嗎？')) return;
  const camp = getCurrentCamp();
  camp.items = camp.items.filter(i => i.id !== id);
  saveDb();
  renderLists();
  updateBuyerSuggestions();
  showToast('已刪除商品');
}

function openEditModal(id) {
  const camp = getCurrentCamp();
  const item = camp.items.find(i => i.id === id);
  if(!item) return;

  document.getElementById('editItemId').value = item.id;
  document.getElementById('editFriendInput').value = item.friend;
  document.getElementById('editItemName').value = item.name;
  document.getElementById('editItemPriceType').value = item.priceType || 'jpy';
  document.getElementById('editItemPrice').value = item.price;
  document.getElementById('editItemQty').value = item.qty;
  document.getElementById('editItemNote').value = item.note || '';

  openModal('editModal');
}

function saveEditItem() {
  const id = document.getElementById('editItemId').value;
  const camp = getCurrentCamp();
  const item = camp.items.find(i => i.id === id);
  if(!item) return;

  item.friend = document.getElementById('editFriendInput').value.trim();
  item.name = document.getElementById('editItemName').value.trim();
  item.priceType = document.getElementById('editItemPriceType').value;
  item.price = parseFloat(document.getElementById('editItemPrice').value) || 0;
  item.qty = parseInt(document.getElementById('editItemQty').value) || 1;
  item.note = document.getElementById('editItemNote').value.trim();

  saveDb();
  closeModal('editModal');
  renderLists();
  updateBuyerSuggestions();
  showToast('修改成功！');
}

function openBuyerModal(buyer) {
  const camp = getCurrentCamp();
  if(!camp.buyerMeta) camp.buyerMeta = {};
  const meta = camp.buyerMeta[buyer] || { deposit: 0, shipping: 0, note: '' };

  document.getElementById('modalBuyerTitle').innerText = `${buyer} - 結算設定`;
  document.getElementById('modalBuyerName').value = buyer;
  document.getElementById('modalBuyerDeposit').value = meta.deposit || '';
  document.getElementById('modalBuyerShipping').value = meta.shipping || '';
  document.getElementById('modalBuyerNote').value = meta.note || '';

  openModal('buyerModal');
}

function saveBuyerMeta() {
  const buyer = document.getElementById('modalBuyerName').value;
  const deposit = parseFloat(document.getElementById('modalBuyerDeposit').value) || 0;
  const shipping = parseFloat(document.getElementById('modalBuyerShipping').value) || 0;
  const note = document.getElementById('modalBuyerNote').value.trim();

  const camp = getCurrentCamp();
  if(!camp.buyerMeta) camp.buyerMeta = {};
  camp.buyerMeta[buyer] = { deposit, shipping, note };

  saveDb();
  closeModal('buyerModal');
  renderLists();
  showToast('結算設定已儲存');
}

function copyBuyerOrder(buyer) {
  const camp = getCurrentCamp();
  const items = camp.items.filter(i => i.friend === buyer);
  if(!camp.buyerMeta) camp.buyerMeta = {};
  const meta = camp.buyerMeta[buyer] || { deposit: 0, shipping: 0, note: '' };

  let text = `【Pika 買買助手】代購對帳單\n買家：${buyer}\n--------------------\n`;
  let totalNTD = 0;

  items.forEach((item, idx) => {
    const q = item.qty || 1;
    let lineNTD = 0;
    if(item.priceType === 'ntd') {
      lineNTD = (item.price || 0) * q;
      text += `${idx+1}. ${item.name} x${q} (NT$ ${item.price}) = NT$ ${lineNTD}\n`;
    } else {
      lineNTD = Math.round((item.price || 0) * camp.rate * q);
      text += `${idx+1}. ${item.name} x${q} (${item.price}円) = NT$ ${lineNTD}\n`;
    }
    if(item.note) text += `   備註：${item.note}\n`;
    totalNTD += lineNTD;
  });

  text += `--------------------\n`;
  text += `商品總計：NT$ ${totalNTD}\n`;
  if(meta.deposit > 0) text += `已付訂金：- NT$ ${meta.deposit}\n`;
  if(meta.shipping > 0) text += `運費/其他：+ NT$ ${meta.shipping}\n`;
  if(meta.note) text += `備註說明：${meta.note}\n`;
  const final = totalNTD - (meta.deposit || 0) + (meta.shipping || 0);
  text += `--------------------\n`;
  text += `💡 最終結算尾款：NT$ ${final}\n感謝您的購買！✨`;

  navigator.clipboard.writeText(text).then(() => {
    showToast(`已複製 ${buyer} 的對帳單！`);
  });
}

function renderStats() {
  const camp = getCurrentCamp();
  let totalItems = camp.items.reduce((sum, i) => sum + i.qty, 0);
  let boughtItems = camp.items.reduce((sum, i) => sum + (i.status !== 'unpacked' ? i.qty : 0), 0);
  let totalJpy = 0;
  let totalNtd = 0;

  camp.items.forEach(i => {
    const q = i.qty || 1;
    if(i.priceType === 'ntd') {
      totalNtd += (i.price || 0) * q;
    } else {
      totalJpy += (i.price || 0) * q;
      totalNtd += Math.round((i.price || 0) * camp.rate * q);
    }
  });

  document.getElementById('statTotalItems').innerText = totalItems;
  document.getElementById('statBoughtItems').innerText = boughtItems;
  document.getElementById('statTotalJpy').innerText = totalJpy.toLocaleString();
  document.getElementById('statTotalNtd').innerText = totalNtd.toLocaleString();

  const container = document.getElementById('statListContainer');
  container.innerHTML = '';

  const summaryMap = {};
  camp.items.forEach(i => {
    const key = i.name + '_' + (i.priceType || 'jpy') + '_' + i.price;
    if(!summaryMap[key]) {
      summaryMap[key] = { name: i.name, priceType: i.priceType || 'jpy', price: i.price, qty: 0, bought: 0 };
    }
    summaryMap[key].qty += i.qty;
    if(i.status !== 'unpacked') summaryMap[key].bought += i.qty;
  });

  Object.values(summaryMap).forEach(s => {
    const div = document.createElement('div');
    div.className = 'panel';
    div.style.margin = '8px 0';
    div.style.padding = '10px 15px';
    if(s.bought >= s.qty) div.classList.add('stat-row-packed');

    let pStr = s.priceType === 'ntd' ? `NT$ ${s.price}` : `${s.price} 円`;
    div.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div>
          <div style="font-size:0.95rem;">${s.name}</div>
          <div style="font-size:0.8rem;color:#666;margin-top:2px;">單價: ${pStr}</div>
        </div>
        <div style="text-align:right;">
          <div style="font-size:0.9rem;font-weight:700;color:var(--btn-active);">已買 ${s.bought} / 共 ${s.qty}</div>
        </div>
      </div>
    `;
    container.appendChild(div);
  });
}

function resetProgress() {
  if(!confirm('確定要重置所有商品的採購進度嗎？\n(商品名稱、價格、買家資料與設定皆會完整保留)')) return;
  const camp = getCurrentCamp();
  camp.items.forEach(i => {
    i.status = 'unpacked';
    i.boughtQty = 0;
  });
  saveDb();
  renderLists();
  renderStats();
  showToast('已重置採購進度');
}

function exportData() {
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db));
  const dlAnchor = document.createElement('a');
  dlAnchor.setAttribute("href", dataStr);
  dlAnchor.setAttribute("download", `pika_buy_backup_${Date.now()}.json`);
  document.body.appendChild(dlAnchor);
  dlAnchor.click();
  dlAnchor.remove();
  showToast('已匯出備份檔案');
}

function importData(event) {
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const parsed = JSON.parse(e.target.result);
      if(parsed && parsed.camps) {
        db = parsed;
        saveDb();
        renderCampSelect();
        updateCampSettingsUI();
        renderLists();
        updateBuyerSuggestions();
        showToast('資料還原成功！');
      } else {
        alert('檔案格式錯誤！');
      }
    } catch(err) {
      alert('解析備份檔案失敗');
    }
  };
  reader.readAsText(file);
}

function openCampModal() {
  renderCampList();
  openModal('campModal');
}

function renderCampList() {
  const container = document.getElementById('campListContainer');
  container.innerHTML = '';
  Object.keys(db.camps).forEach(campName => {
    const div = document.createElement('div');
    div.style.cssText = 'display:flex;justify-content:space-between;align-items:center;padding:8px;border-bottom:1px solid #eee;font-size:0.9rem;';
    div.innerHTML = `
      <span>📦 ${campName} ${campName === db.activeCamp ? '(目前)' : ''}</span>
      ${Object.keys(db.camps).length > 1 ? `<button class="btn-sm-action" onclick="deleteCamp('${campName}')" style="color:var(--tax-red);border-color:var(--tax-red);">刪除</button>` : ''}
    `;
    container.appendChild(div);
  });
}

function createNewCamp() {
  const name = document.getElementById('newCampName').value.trim();
  if(!name) {
    alert('請輸入代購團名稱');
    return;
  }
  if(db.camps[name]) {
    alert('此代購團名稱已存在！');
    return;
  }
  db.camps[name] = { rate: 0.22, costRate: 0.21, showItemPrice: true, items: [], buyerMeta: {} };
  db.activeCamp = name;
  saveDb();
  document.getElementById('newCampName').value = '';
  closeModal('campModal');
  renderCampSelect();
  updateCampSettingsUI();
  renderLists();
  updateBuyerSuggestions();
  showToast(`已建立並切換至: ${name}`);
}

function deleteCamp(campName) {
  if(Object.keys(db.camps).length <= 1) {
    alert('至少需要保留一個代購團！');
    return;
  }
  if(!confirm(`確定要刪除代購團「${campName}」及其所有商品資料嗎？`)) return;
  delete db.camps[campName];
  if(db.activeCamp === campName) {
    db.activeCamp = Object.keys(db.camps)[0];
  }
  saveDb();
  renderCampList();
  renderCampSelect();
  updateCampSettingsUI();
  renderLists();
  updateBuyerSuggestions();
  showToast('已刪除代購團');
}

function openModal(id) { document.getElementById(id).style.display = 'flex'; }
function closeModal(id) { document.getElementById(id).style.display = 'none'; }
function showBigImg(src) {
  const win = window.open("");
  win.document.write(`<img src="${src}" style="width:100%;object-fit:contain;">`);
}

window.onload = initApp;
</script>
</body>
</html>
